# Rime schema
# encoding: utf-8

schema:
  schema_id: nom_viet
  name: Nôm Việt 喃越
  version: "1.0"
  author:
    - Nôm Na Việt <nomnaviet.com>
  description: |
    Vietnamese Nôm (Chữ Nôm) input method with Telex support.
    Type Vietnamese using Telex: aa=â, aw=ă, ow=ơ, uw=ư, dd=đ
    Tones: s=sắc, f=huyền, r=hỏi, x=ngã, j=nặng
    Example: "nguowif" → người → 𠊛

switches:
  - name: ascii_mode
    reset: 0
    states: [ Nôm, ASCII ]
  - name: full_shape
    states: [ 半角, 全角 ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - table_translator@custom_phrase
    - script_translator
  filters:
    - uniquifier

speller:
  alphabet: "abcdefghijklmnopqrstuvwxyz"
  delimiter: " '"
  algebra:
    # Typing without marks or tones: 'vietnam' → việt nam, 'nguoi' → người,
    # 'dai hoc' → đại học. Each rule adds a spelling with that mark dropped
    # in every syllable, alongside the full one, so a marked or toned key
    # still narrows the candidates. fuzz, not derive: these spellings rank at
    # half weight, so a syllable typed whole (thuwowng → thương) still puts
    # its own candidates ahead of other tones'. They come first so the
    # tone-at-end rule below also accepts 'vietj'. A tone letter after a
    # vowel is always the tone: no Vietnamese final consonant is s, f, r, x
    # or j.
    - "fuzz/aa/a/"
    - "fuzz/aw/a/"
    - "fuzz/ee/e/"
    - "fuzz/oo/o/"
    - "fuzz/ow/o/"
    - "fuzz/uw/u/"
    - "fuzz/dd/d/"
    - "fuzz/([aeiouyw])[sfrxj]/$1/"
    # Accept tone code at the end of a syllable as well as immediately after
    # the toned vowel. The dict stores 'ngafy', 'vieejt', 'nguwowfi'
    # (tone-after-vowel); this rule also accepts the Unikey-style
    # 'ngayf', 'vieetj', 'nguwowif' (tone-at-end). Anchored on word
    # boundaries so it works per-syllable in multi-syllable codes.
    - "derive/(^|[ ])([^sfrxj ]*)([sfrxj])([^sfrxj ]+)(?=[ ]|$)/$1$2$4$3/"
    # Accept single-w 'uow' as a synonym for stored 'uwow' (ươ cluster).
    # Matches standard Telex on commercial IMEs (Unikey, etc.) and saves a
    # keystroke on ~1,400 entries (e.g. nguowfi → người, chuowsng → xướng).
    - "derive/uwow/uow/"
    # Accept lone 'w' as a shortcut for 'uw' (ư). Matches Unikey-style Telex:
    # 'tw' → tư, 'chwa' → chưa, etc. Applies after 'aw'/'ow'/'uw' compounds
    # are already matched, so it only affects bare 'w' positions.
    - "derive/uw/w/"
    # Allow first-letter abbreviation for quick input
    - "abbrev/^([a-z]).+$/$1/"

translator:
  dictionary: nom_viet
  prism: nom_viet
  enable_user_dict: true
  enable_sentence: true
  enable_completion: true
  preedit_format:
    # Convert Telex back to Vietnamese for display.
    # First, normalize end-of-syllable tone position to immediately-after-vowel
    # so the per-vowel xforms below ("af → à" etc.) match either input style.
    # Pattern: vowel (compound or plain) + optional off-glide + optional
    # consonants + tone at end of syllable → vowel + tone + glide + consonants.
    - "xform/(aa|aw|ee|oo|ow|uw|[aeiouy])([iyuw]?)([^aeiouywsfrxj ]*)([sfrxj])(?=$| )/$1$4$2$3/"
    - "xform/dd/đ/"
    - "xform/awj/ặ/"
    - "xform/awx/ẵ/"
    - "xform/awr/ẳ/"
    - "xform/aws/ắ/"
    - "xform/awf/ằ/"
    - "xform/aw/ă/"
    - "xform/aaj/ậ/"
    - "xform/aax/ẫ/"
    - "xform/aar/ẩ/"
    - "xform/aas/ấ/"
    - "xform/aaf/ầ/"
    - "xform/aa/â/"
    - "xform/eej/ệ/"
    - "xform/eex/ễ/"
    - "xform/eer/ể/"
    - "xform/ees/ế/"
    - "xform/eef/ề/"
    - "xform/ee/ê/"
    - "xform/ooj/ộ/"
    - "xform/oox/ỗ/"
    - "xform/oor/ổ/"
    - "xform/oos/ố/"
    - "xform/oof/ồ/"
    - "xform/oo/ô/"
    - "xform/owj/ợ/"
    - "xform/owx/ỡ/"
    - "xform/owr/ở/"
    - "xform/ows/ớ/"
    - "xform/owf/ờ/"
    - "xform/ow/ơ/"
    - "xform/uwj/ự/"
    - "xform/uwx/ữ/"
    - "xform/uwr/ử/"
    - "xform/uws/ứ/"
    - "xform/uwf/ừ/"
    - "xform/uw/ư/"
    # Lone 'w' shortcut: any remaining w (i.e. not consumed by aw/ow/uw above)
    # represents ư. Matches Unikey-style 'tw' → tư, 'chwa' → chưa.
    - "xform/wj/ự/"
    - "xform/wx/ữ/"
    - "xform/wr/ử/"
    - "xform/ws/ứ/"
    - "xform/wf/ừ/"
    - "xform/w/ư/"
    - "xform/aj/ạ/"
    - "xform/ax/ã/"
    - "xform/ar/ả/"
    - "xform/as/á/"
    - "xform/af/à/"
    - "xform/ej/ẹ/"
    - "xform/ex/ẽ/"
    - "xform/er/ẻ/"
    - "xform/es/é/"
    - "xform/ef/è/"
    - "xform/ij/ị/"
    - "xform/ix/ĩ/"
    - "xform/ir/ỉ/"
    - "xform/is/í/"
    - "xform/if/ì/"
    - "xform/oj/ọ/"
    - "xform/ox/õ/"
    - "xform/or/ỏ/"
    - "xform/os/ó/"
    - "xform/of/ò/"
    - "xform/uj/ụ/"
    - "xform/ux/ũ/"
    - "xform/ur/ủ/"
    - "xform/us/ú/"
    - "xform/uf/ù/"
    - "xform/yj/ỵ/"
    - "xform/yx/ỹ/"
    - "xform/yr/ỷ/"
    - "xform/ys/ý/"
    - "xform/yf/ỳ/"

custom_phrase:
  dictionary: ""
  user_dict: nom_viet_custom
  db_class: stabledb
  enable_completion: false
  enable_sentence: false
  initial_quality: 1

punctuator:
  import_preset: default

key_binder:
  import_preset: default
  bindings:
    - { when: has_menu, accept: Return, send: space }

recognizer:
  import_preset: default
